<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP FOUNDATION - LOGIN SYSTEM</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="topbar">
        <div class="logo-area">
            <img src="SCP_icon.png" alt="SCP_icon" width="50" height="50">
            <span class="brand-title">SCP FOUND. DBMS</span>
        </div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2>LOGIN</h2>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="username">USER:</label>
                    <input type="text" id="username" autocomplete="off" required spellcheck="false">
                </div>
                
                <div class="input-group">
                    <label for="password">PASSWORD:</label>
                    <input type="password" id="password" required>
                </div>
                
                <button type="submit" style="display: none;"></button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p class="motto">SECURE, CONTAIN, PROTECT</p>
    </footer>

    <script src="js/auth.js"></script>
    <title>SCP report 上傳api 連線測試面板</title>
    <style>
        body { background-color: #1e1e1e; color: #ffffff; font-family: sans-serif; padding: 20px; }
        .original-content { border-bottom: 2px dashed #555; padding-bottom: 20px; margin-bottom: 30px; }
        .card { background-color: #2d2d2d; padding: 20px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #444; }
        input, textarea, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: 1px solid #555; box-sizing: border-box; }
        input, textarea { background-color: #3d3d3d; color: #fff; }
        button { background-color: #a30000; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #d60000; }
        pre { background-color: #111; padding: 15px; border-radius: 4px; overflow-x: auto; color: #00ff00; }
    </style>
</head>
