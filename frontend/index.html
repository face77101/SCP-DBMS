<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCP FOUNDATION - SECURE LOGIN</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <header class="topbar">
        <div class="logo-area">
            <img src="SCP_icon.png" alt="SCP_icon" width="50" height="50">
            <span class="brand-title">SCP FOUND. DBMS</span>
        </div>
    </header>

    <main class="login-container">
        <div class="login-card">
            <h2>AUTHORIZATION REQUIRED</h2>
            
            <form id="login-form">
                <div class="input-group">
                    <label for="username">OPERATIVE ID:</label>
                    <input type="text" id="username" autocomplete="off" required spellcheck="false" placeholder="Enter Agent ID...">
                </div>
                
                <div class="input-group">
                    <label for="password">PASSCODE:</label>
                    <input type="password" id="password" required placeholder="Enter Passcode...">
                </div>
                
                <button type="submit" class="terminal-btn" id="btn-login" style="width: 100%; margin-top: 20px;">INITIATE LOGIN</button>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p class="motto">SECURE. CONTAIN. PROTECT.</p>
    </footer>

    <script src="js/auth.js"></script>
    
</body>
</html>
