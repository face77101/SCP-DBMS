<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>成員名單</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; color: #1a1a1a; padding: 2rem; }
    h1 { font-size: 22px; font-weight: 500; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 1.5rem; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
    input[type="text"] { padding: 8px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; width: 280px; outline: none; }
    input[type="text"]:focus { border-color: #aaa; }
    button { padding: 8px 16px; border: 1px solid #ddd; border-radius: 8px; background: white; font-size: 13px; cursor: pointer; }
    button:hover { background: #f0f0f0; }
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; border: 1px solid #e0e0e0; font-size: 14px; }
    thead th { text-align: left; padding: 10px 16px; font-size: 12px; font-weight: 500; color: #888; border-bottom: 1px solid #e0e0e0; }
    tbody tr { border-bottom: 1px solid #f0f0f0; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fafafa; }
    tbody td { padding: 12px 16px; }
    .mono { font-family: monospace; font-size: 13px; }
    select { padding: 4px 8px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: white; cursor: pointer; }
    a { color: #378add; text-decoration: none; font-size: 13px; }
    a:hover { text-decoration: underline; }
    .error { color: red; margin-top: 1rem; font-size: 13px; }
  </style>
</head>
<body>

  <h1>成員名單</h1>
  <p class="subtitle" id="subtitle">載入中...</p>

  <div class="toolbar">
    <input type="text" id="search" placeholder="搜尋成員代號或部門..." oninput="filterTable()" />
    <button onclick="location.href='/members/add'">+ 新增成員</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>成員代號</th>
        <th>部門</th>
        <th>安保等級</th>
        <th>人員編級</th>
        <th>精神狀態</th>
        <th>修改狀態</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <p class="error" id="error-msg"></p>

  <script>
    fetch('/api/admin/members')
      .then(res => res.json())
      .then(data => {
        document.getElementById('subtitle').textContent = '共 ' + data.length + ' 名成員'
        const tbody = document.getElementById('table-body')
        tbody.innerHTML = data.map(m => `
          <tr>
            <td class="mono"><a href="/member_detail.html?memID=${m.memID}">${m.memID}</a></td>
            <td>${m.dept_name}</td>
            <td>${m.clearance_lv}</td>
            <td>${m.permission}</td>
            <td id="status-${m.memID}">${m.mem_status}</td>
            <td>
              <select onchange="updateStatus('${m.memID}', this.value)">
                <option value="">-- 選擇 --</option>
                <option value="normal">normal</option>
                <option value="abnormal">abnormal</option>
                <option value="treating">treating</option>
                <option value="dead">dead</option>
              </select>
            </td>
          </tr>
        `).join('')
      })
      .catch(err => {
        document.getElementById('subtitle').textContent = ''
        document.getElementById('error-msg').textContent = '載入失敗：' + err
      })

    function updateStatus(memID, newStatus) {
      if (!newStatus) return
      fetch(`/api/admin/members/${memID}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mem_status: newStatus })
      })
      .then(res => res.json())
      .then(data => {
        if (data.message) {
          document.getElementById('status-' + memID).textContent = newStatus
          alert('更新成功')
        } else {
          alert('更新失敗：' + data.error)
        }
      })
      .catch(err => alert('更新失敗：' + err))
    }

    function filterTable() {
      const keyword = document.getElementById('search').value.toLowerCase()
      document.querySelectorAll('#table-body tr').forEach(row => {
        row.style.display = row.textContent.toLowerCase().includes(keyword) ? '' : 'none'
      })
    }
  </script>

</body>
</html>
